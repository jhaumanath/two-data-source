# JPA Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# PostgreSQL DataSource (Read Operations)
spring.datasource.read.jdbcUrl=jdbc:postgresql://localhost:5432/read
spring.datasource.read.username=postgres
spring.datasource.read.password=postgres
spring.datasource.read.driver-class-name=org.postgresql.Driver

# PostgreSQL DataSource (Write Operations)
spring.datasource.write.jdbcUrl=jdbc:postgresql://localhost:5432/write
spring.datasource.write.username=postgres
spring.datasource.write.password=postgres
spring.datasource.write.driver-class-name=org.postgresql.Driver

# Enable Bean Definition Overriding (if necessary)
spring.main.allow-bean-definition-overriding=true

# Log configuration for debugging purposes
logging.level.org.springframework.transaction.interceptor=DEBUG
logging.level.org.springframework.aop=DEBUG


